决定后，我通常不喜欢反复变动。","J"],["我会主动列清单或安排优先级。","J"],["我更喜欢稳定、可预期的节奏。","J"],["我喜欢保留弹性，随情况调整安排。","P"],["临场发挥有时会让我更有灵感。","P"],["我不喜欢被过早固定在一个方案里。","P"],["我常常边探索边决定下一步。","P"],["面对变化，我通常能比较快地适应。","P"],["我喜欢开放式的任务和多种选择。","P"],["太严格的计划会让我觉得受限。","P"],["我会为了减少不确定性而提前准备。","J"],["我喜欢把未完成事项尽快收尾。","J"],["我在秩序清楚的环境中表现更稳定。","J"],["我倾向于按规则或流程推进事情。","J"],["我愿意等信息更完整后再做最终决定。","P"],["我享受探索过程中出现的新机会。","P"],["我能接受计划被临时打乱。","P"],["我喜欢同时保留几个可能方向。","P"],["我重视效率和明确结论。","J"],["我更重视自由度和即时反馈。","P"]]};
var typeInfo={ISTJ:["检查者","你踏实、可靠，重视秩序、责任和现实结果。你通常会认真履行承诺，善于把复杂任务拆解成清晰步骤，并以稳定的方式推进。你不喜欢空泛承诺，更相信事实、经验和可验证的成果。面对压力时，你可能显得克制，但内心有很强的担当感。","财务审计、项目管理、行政运营、质量管理"],ISFJ:["守护者","你温和细致，重视安全感、责任和人与人之间的照顾。你常能注意到他人的需要，也愿意用实际行动提供支持。你做事认真可靠，喜欢稳定而有秩序的环境。你不一定主动争取舞台，却常常是团队中让人安心的力量。","护理医疗、教育支持、人力资源、客户服务"],INFJ:["提倡者","你敏感而有洞察力，重视意义、理想和深层连接。你常能看见别人情绪背后的原因，也会思考自己能为世界带来什么改变。你外表可能安静，内在却有清晰价值观和长期愿景。你适合把同理心、判断力与创造力结合起来。","心理咨询、公益策划、品牌内容、教育研究"],INTJ:["建筑师","你独立、冷静，喜欢从长远角度规划系统和策略。你擅长发现结构中的问题，并提出更高效的改进方式。你通常不满足于表面答案，而会追问背后的逻辑。你重视能力、深度和自主性，也愿意为重要目标长期投入。","战略咨询、产品规划、科研分析、系统架构"],ISTP:["鉴赏家","你冷静灵活，喜欢理解事物如何运作，并通过实践解决问题。你不太喜欢冗长说明，更愿意直接观察、试验和调整。你在突发状况下常能保持镇定，快速抓住关键。你需要自由空间，也重视真实、有效和可操作的方案。","工程技术、数据分析、机械维修、应急管理"],ISFP:["探险家","你温柔敏锐，重视真实感受、个人审美和当下体验。你通常不喜欢被强迫定义，更愿意按照内心节奏生活。你能感受到细微氛围，也愿意用行动表达关怀。你适合在有自由度的环境中发挥创造力和细腻观察。","视觉设计、摄影艺术、手作创作、体验策划"],INFP:["调停者","你理想主义、富有同理心，重视真诚、价值和内在意义。你常会思考自己真正相信什么，也希望生活与内心保持一致。你对人的情绪和故事很敏感，擅长用文字、创意或陪伴传递温度。你需要被理解，也需要自由表达。","写作编辑、心理助人、文化创意、公益传播"],INTP:["逻辑学家","你好奇、理性，喜欢拆解概念、研究原理和探索可能性。你常常会对一个问题进行深入思考，并享受找到更准确解释的过程。你不太喜欢僵硬规则，更重视思想自由。你适合处理复杂、抽象、需要独立判断的问题。","软件开发、学术研究、数据建模、产品逻辑设计"],ESTP:["企业家","你行动力强、反应快，喜欢真实场景中的挑战和机会。你擅长观察环境变化，并迅速做出实用选择。你不喜欢过度空谈，更愿意通过尝试获得结果。你有感染力，也常能在压力场合带动节奏。","销售拓展、创业经营、活动执行、商务谈判"],ESFP:["表演者","你热情自然，喜欢与人互动，也善于营造轻松愉快的氛围。你关注当下体验，容易发现生活中的乐趣和美感。你通常很有亲和力，能让别人感到被接纳。你适合需要表达、互动和现场反应的工作。","活动主持、市场传播、服务体验、娱乐传媒"],ENFP:["竞选者","你充满热情和想象力，喜欢探索新可能，也善于激励别人。你重视自由、真诚和意义，常常能从不同人和事中获得灵感。你不喜欢重复乏味的限制，更适合变化丰富、允许创造和表达的环境。","品牌策划、内容创作、培训引导、创新项目"],ENTP:["辩论家","你好奇机敏，喜欢挑战旧观点，探索新的解决方式。你擅长快速联想、提出问题，也享受思想碰撞带来的刺激。你不太喜欢一成不变的流程，更愿意在变化中寻找机会。","创业创新、商业分析、产品策略、创意咨询"],ESTJ:["总经理","你务实果断，重视规则、效率和结果。你通常能快速看清任务重点，并组织资源推进执行。你喜欢清楚的责任分工，也愿意为团队目标承担管理职责。你表达直接，行动稳定，适合需要秩序和决断力的环境。","运营管理、团队主管、供应链管理、政企行政"],ESFJ:["执政官","你友善负责，重视合作、关系和共同体的稳定。你善于照顾他人感受，也擅长把团队事务安排得井井有条。你希望自己的付出被看见，并倾向于通过实际行动维护和谐。你适合连接人与资源的角色。","人力资源、社区运营、教育培训、客户成功"],ENFJ:["主人公","你热情、有感染力，擅长理解他人并带领大家朝共同目标前进。你关注人的潜力，也愿意为别人提供鼓励和方向。你重视价值、关系和成长，适合在需要沟通、组织和影响力的场景中发挥优势。","组织发展、教育培训、公共关系、团队管理"],ENTJ:["指挥官","你目标清晰、行动果断，擅长制定战略并推动执行。你通常关注效率、竞争力和长远结果，能在复杂局面中快速建立秩序。你欣赏能力和担当，也愿意承担领导责任。你适合有挑战、有空间的舞台。","企业管理、战略咨询、业务负责人、投资分析"]};
var currentQuestions=[],answers=[],currentIndex=0;
function makeQuestions(mode){var counts=mode==="quick"?{EI:7,SN:7,TF:7,JP:7}:{EI:24,SN:25,TF:24,JP:24};var result=[];Object.keys(counts).forEach(function(d){q[d].slice(0,counts[d]).forEach(function(item){result.push({text:item[0],dimension:d,positive:item[1]});});});return result;}
function showPage(pageId){["startPage","quizPage","resultPage"].forEach(function(id){document.getElementById(id).classList.toggle("hidden",id!==pageId);});}
function startTest(mode){currentQuestions=makeQuestions(mode);answers=Array(currentQuestions.length).fill(null);currentIndex=0;document.getElementById("versionLabel").textContent=mode==="quick"?"快速版":"完整版";showPage("quizPage");renderQuestion();}
function renderQuestion(){var question=currentQuestions[currentIndex];var total=currentQuestions.length;var answeredCount=answers.filter(function(a){return a!==null;}).length;document.getElementById("questionIndex").textContent="第 "+(currentIndex+1)+" 题 / 共 "+total+" 题";document.getElementById("questionText").textContent=question.text;document.getElementById("progressText").textContent="已答 "+answeredCount+" / "+total;document.getElementById("progressFill").style.width=((answeredCount/total)*100)+"%";var optionsEl=document.getElementById("options");optionsEl.innerHTML="";optionLabels.forEach(function(label,index){var option=document.createElement("label");option.className="option";if(answers[currentIndex]===optionValues[index])option.classList.add("selected");var input=document.createElement("input");input.type="radio";input.name="answer";input.value=String(optionValues[index]);input.checked=answers[currentIndex]===optionValues[index];var span=document.createElement("span");span.textContent=label;option.appendChild(input);option.appendChild(span);option.addEventListener("click",function(){answers[currentIndex]=optionValues[index];renderQuestion();});optionsEl.appendChild(option);});document.getElementById("prevBtn").disabled=currentIndex===0;document.getElementById("nextBtn").textContent=currentIndex===total-1?"查看结果":"下一题";}
function prevQuestion(){if(currentIndex>0){currentIndex--;renderQuestion();}}
function nextQuestion(){if(answers[currentIndex]===null){alert("请先选择一个选项，再继续下一题。");return;}if(currentIndex<currentQuestions.length-1){currentIndex++;renderQuestion();}else{showResult();}}
function calculateType(){var scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};var pairs={EI:["E","I"],SN:["S","N"],TF:["T","F"],JP:["J","P"]};currentQuestions.forEach(function(question,index){var value=answers[index];var pair=pairs[question.dimension];var positive=question.positive;var negative=pair[0]===positive?pair[1]:pair[0];if(value>0)scores[positive]+=value;else if(value<0)scores[negative]+=Math.abs(value);});return (scores.E>=scores.I?"E":"I")+(scores.S>=scores.N?"S":"N")+(scores.T>=scores.F?"T":"F")+(scores.J>=scores.P?"J":"P");}
function showResult(){var type=calculateType();var info=typeInfo[type];document.getElementById("resultType").textContent=type;document.getElementById("typeName").textContent=info[0]+"型人格";document.getElementById("typeDesc").textContent=info[1];document.getElementById("careerText").textContent=info[2];showPage("resultPage");window.scrollTo({top:0,behavior:"smooth"});}
function restart(){showPage("startPage");window.scrollTo({top:0,behavior:"smooth"});}
</script>
